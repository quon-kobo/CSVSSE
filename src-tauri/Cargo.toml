[package]
name = "csvsse"
version = "0.1.8"
description = "CSVSSE - simple CSV editor"
authors = ["QUON KOBO"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows.
name = "csvsse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_UI_Shell",
  "Win32_Globalization",
  "Win32_Foundation",
  "Win32_Networking_WinHttp",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
serde_json = "1"
encoding_rs = "0.8"
chardetng = "0.1"
# Update signature check (minisign / `tauri signer` format)
minisign-verify = "0.2"
base64 = "0.21"

# Size-oriented release profile: https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
